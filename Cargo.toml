[workspace]

members = [
    "./name_token",
    "./dns_nostr_server",
]

[workspace.dependencies]
async-trait = "0.1.83"
bitcoin = "0.32.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.39.3", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "fs",
] }
