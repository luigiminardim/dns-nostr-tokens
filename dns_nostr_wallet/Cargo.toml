[package]
name = "dns_nostr_wallet"
version = "0.0.0"
edition = "2021"

[dependencies]
bip39 = { version = "2.1", features = ["rand"] }
bitcoin.workspace = true
bdk_wallet = { version = "1.0", features = ["rusqlite", "keys-bip39"] }
clap = { version = "4", features = ["derive"] }
dns_nostr_token = { path = "../dns_nostr_token" }
nostr-sdk = "0.41.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
